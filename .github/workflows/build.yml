name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build AirBattery (ad-hoc signed)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build (Release, ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild \
            -project AirBattery.xcodeproj \
            -scheme AirBattery \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -quiet \
            build

      - name: Verify signature
        run: |
          APP=build/Build/Products/Release/AirBattery.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E 'Identifier|Signature|TeamIdentifier'

      - name: Package
        run: |
          APP=build/Build/Products/Release/AirBattery.app
          SHORT_SHA=$(git rev-parse --short HEAD)
          ditto -c -k --sequesterRsrc --keepParent "$APP" "AirBattery-${SHORT_SHA}.app.zip"
          ls -lh AirBattery-*.app.zip
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: AirBattery-${{ env.SHORT_SHA }}
          path: AirBattery-*.app.zip
          if-no-files-found: error
          retention-days: 90
