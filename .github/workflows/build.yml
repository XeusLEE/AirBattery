name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Developer ID signing + notarization run only when the signing secrets exist.
  # Without them the build falls back to an ad-hoc ("Sign to Run Locally") signature,
  # which runs locally after removing the quarantine attribute but is not notarized.
  # The ad-hoc build disables the hardened runtime; see the Build step for why.
  HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.NOTARY_KEY_P8 != '' }}

jobs:
  build:
    name: Build AirBattery
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | awk '{print $2}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in MACOS_CERTIFICATE_P12"
            exit 1
          fi
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Estimator unit tests
        run: |
          set -o pipefail
          swift test --package-path Packages/BatteryEstimator 2>&1 | tail -20

      - name: Build (Release)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          if [ "$HAS_SIGNING" = "true" ]; then
            SIGN_ARGS=(
              CODE_SIGN_STYLE=Manual
              "CODE_SIGN_IDENTITY=$SIGNING_IDENTITY"
              "DEVELOPMENT_TEAM=$APPLE_TEAM_ID"
              CODE_SIGNING_REQUIRED=YES
              CODE_SIGNING_ALLOWED=YES
              "OTHER_CODE_SIGN_FLAGS=--timestamp"
              PROVISIONING_PROFILE_SPECIFIER=
            )
          else
            # Ad-hoc signatures carry no Team ID, so with the hardened runtime enabled
            # dyld's library validation refuses the embedded Sparkle.framework
            # ("mapping process and mapped file have different Team IDs") and the app
            # aborts at launch. The hardened runtime is only needed for notarization,
            # which this path does not do, so turn it off here.
            SIGN_ARGS=(
              CODE_SIGN_STYLE=Manual
              CODE_SIGN_IDENTITY=-
              ENABLE_HARDENED_RUNTIME=NO
              CODE_SIGNING_REQUIRED=NO
              CODE_SIGNING_ALLOWED=YES
              DEVELOPMENT_TEAM=
              PROVISIONING_PROFILE_SPECIFIER=
            )
          fi
          xcodebuild \
            -project AirBattery.xcodeproj \
            -scheme AirBattery \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            "${SIGN_ARGS[@]}" \
            -quiet \
            build

      - name: Sign bundled libimobiledevice tools
        if: env.HAS_SIGNING == 'true'
        run: |
          APP=build/Build/Products/Release/AirBattery.app
          # Xcode does not sign pre-built binaries copied into Resources. Notarization
          # requires every Mach-O to carry a Developer ID signature, hardened runtime
          # and a secure timestamp, so sign them here and then re-seal the outer bundle.
          find "$APP/Contents/Resources/libimobiledevice" -type f | while read -r f; do
            if file -b "$f" | grep -q 'Mach-O'; then
              codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$f"
            fi
          done
          codesign --force --options runtime --timestamp \
            --entitlements AirBattery/AirBattery.entitlements \
            --sign "$SIGNING_IDENTITY" "$APP"

      - name: Verify signature
        run: |
          APP=build/Build/Products/Release/AirBattery.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E 'Identifier|Signature|TeamIdentifier|Authority' || true
          if [ "$HAS_SIGNING" = "true" ]; then
            find "$APP" -type f | while read -r f; do
              if file -b "$f" | grep -q 'Mach-O'; then
                codesign -dv "$f" 2>&1 | grep -q 'Authority=Developer ID Application' \
                  || { echo "::error::Not Developer ID signed: $f"; exit 1; }
              fi
            done
          fi

      - name: Package DMG
        run: |
          APP=build/Build/Products/Release/AirBattery.app
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          DMG="AirBattery_v${VERSION}-${SHORT_SHA}.dmg"

          # Staging folder: the app plus a drag-to-install Applications link
          STAGING=dmg-staging
          rm -rf "$STAGING" && mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create \
            -volname "AirBattery" \
            -srcfolder "$STAGING" \
            -fs HFS+ \
            -format UDZO \
            -imagekey zlib-level=9 \
            -ov "$DMG"

          if [ "$HAS_SIGNING" = "true" ]; then
            codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$DMG"
          else
            codesign --force --sign - "$DMG"
          fi
          hdiutil verify "$DMG"
          ls -lh "$DMG"
          echo "DMG_NAME=$DMG" >> "$GITHUB_ENV"

      - name: Notarize and staple
        if: env.HAS_SIGNING == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$KEY"' EXIT
          echo "$NOTARY_KEY_P8" | base64 --decode > "$KEY"
          xcrun notarytool submit "$DMG_NAME" \
            --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait --timeout 30m --output-format json > notary.json
          cat notary.json
          STATUS=$(jq -r '.status' notary.json)
          if [ "$STATUS" != "Accepted" ]; then
            SUBMISSION_ID=$(jq -r '.id' notary.json)
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
            exit 1
          fi
          xcrun stapler staple "$DMG_NAME"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG_NAME"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DMG_NAME }}
          path: ${{ env.DMG_NAME }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG_NAME" --clobber
          else
            gh release create "$TAG" "$DMG_NAME" \
              --title "AirBattery $TAG" \
              --notes-file .github/release-notes.md
          fi
          echo "Released $DMG_NAME as $TAG"

      - name: Remove build keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
