name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build AirBattery (ad-hoc signed)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build (Release, ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild \
            -project AirBattery.xcodeproj \
            -scheme AirBattery \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -quiet \
            build

      - name: Verify signature
        run: |
          APP=build/Build/Products/Release/AirBattery.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E 'Identifier|Signature|TeamIdentifier'

      - name: Package DMG
        run: |
          APP=build/Build/Products/Release/AirBattery.app
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          DMG="AirBattery_v${VERSION}-${SHORT_SHA}.dmg"

          # Staging folder: the app plus a drag-to-install Applications link
          STAGING=dmg-staging
          rm -rf "$STAGING" && mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create \
            -volname "AirBattery" \
            -srcfolder "$STAGING" \
            -fs HFS+ \
            -format UDZO \
            -imagekey zlib-level=9 \
            -ov "$DMG"

          # Ad-hoc sign the image itself as well
          codesign --force --sign - "$DMG"
          hdiutil verify "$DMG"
          ls -lh "$DMG"
          echo "DMG_NAME=$DMG" >> "$GITHUB_ENV"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DMG_NAME }}
          path: ${{ env.DMG_NAME }}
          if-no-files-found: error
          retention-days: 90
